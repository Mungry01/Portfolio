<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS Calculator & Activities</title>
  <link rel="stylesheet" href="calc.css">
</head>
<body>

  <!-- Calculator Section -->
  <section class="section">
    <div class="calculator">
      <h2>Calculator</h2>
      <input type="text" id="display" disabled>

      <div class="buttons">
        <button onclick="clearDisplay()">C</button>
        <button onclick="appendValue('/')">÷</button>
        <button onclick="appendValue('*')">×</button>
        <button onclick="appendValue('-')">−</button>

        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button onclick="appendValue('+')">+</button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button onclick="calculateResult()" class="equals">=</button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>

        <button onclick="appendValue('0')" class="zero">0</button>
        <button onclick="appendValue('.')">.</button>
      </div>
    </div>
  </section>

  <!-- Multiplication Table Section -->
  <section class="section">
    <div class="tool">
      <h2>Multiplication Table (Nested Loops)</h2>
      <input type="number" id="tableNum" placeholder="Enter table size (e.g. 5)">
      <button onclick="generateTable()">Generate Table</button>

      <div class="table-wrapper">
        <table id="mulTable"></table>
      </div>
    </div>
  </section>

  <!-- Comparison Section -->
  <section class="section">
    <div class="tool">
      <h2>Compare Two Numbers</h2>
      <input type="number" id="num1" placeholder="Number 1">
      <input type="number" id="num2" placeholder="Number 2">
      <button onclick="compareNumbers()">Compare</button>
      <p id="compareResult"></p>
    </div>
  </section>

  <script src="calc.js"></script>
</body>
</html>
